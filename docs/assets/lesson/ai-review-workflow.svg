<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="614" viewBox="0 0 1180 614" role="img" aria-labelledby="diagram-title diagram-desc" lang="ko">
  <title id="diagram-title">AI 초안을 항목별로 검증하고 근거와 함께 전달하는 흐름</title>
  <desc id="diagram-desc">사용자 요청과 조건을 정리해 모델이 초안을 생성하면 내용을 확인 가능한 항목으로 나눈다. 검사 코드나 사람이 기준 자료, 운영 기록, 외부 원문에 비춰 각 항목을 판정한다. 통과한 항목은 근거와 함께 사용자에게 전달한다. 고칠 수 있는 항목은 원문을 보고 수정한 뒤 한 번만 다시 검사한다. 근거가 없거나 재검사에 실패한 항목은 제외한다. 모든 항목의 판정과 수정 내역은 검증 기록에 남긴다.</desc>
  <defs>
    <marker id="forward" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#394b5f"/></marker>
    <marker id="pass" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#176550"/></marker>
    <marker id="retry" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#94561d"/></marker>
    <marker id="record" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#695d83"/></marker>
    <style>
      text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", sans-serif; fill: #1e3041; }
      .panel { stroke: #c1ccd3; stroke-width: 1.1; }
      .head { font-size: 25px; font-weight: 700; letter-spacing: -1px; }
      .lane-rule { stroke: #ccd4d6; stroke-width: 1; }
      .box { fill: #fff; stroke: #8697a5; stroke-width: 1.4; }
      .name { font-size: 23px; font-weight: 700; letter-spacing: -.9px; }
      .sub { font-size: 17px; fill: #445766; letter-spacing: -.45px; }
      .group-title { font-size: 18px; font-weight: 700; }
      .route, .approved, .correction, .evidence, .log { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      .route { stroke: #394b5f; marker-end: url(#forward); }
      .approved { stroke: #176550; stroke-width: 2.6; marker-end: url(#pass); }
      .correction { stroke: #94561d; stroke-width: 2.4; marker-end: url(#retry); }
      .evidence { stroke: #286b60; stroke-dasharray: 4 5; }
      .log { stroke: #695d83; stroke-dasharray: 4 5; marker-end: url(#record); }
    </style>
  </defs>

  <rect width="1180" height="614" fill="#fff"/>
  <rect class="panel" x="8" y="8" width="254" height="423" rx="11" fill="#f3f5f6"/>
  <rect class="panel" x="293" y="8" width="582" height="423" rx="11" fill="#f2f5f9"/>
  <rect class="panel" x="907" y="8" width="265" height="423" rx="11" fill="#f0f5f2"/>
  <rect class="panel" x="8" y="481" width="867" height="125" rx="11" fill="#f2f7f5"/>
  <rect class="panel" x="907" y="481" width="265" height="125" rx="11" fill="#f5f2f7"/>
  <path class="lane-rule" d="M24 66H246 M309 66H859 M923 66H1156"/>
  <g class="head">
    <text x="31" y="47">초안 생성</text><text x="317" y="47">항목별 검증</text><text x="931" y="47">응답 전달</text>
  </g>
  <text x="32" y="513" class="group-title" style="fill:#286b60">대조 자료</text>
  <text x="932" y="513" class="group-title" style="fill:#695d83">판정 뒤 남는 기록</text>

  <!-- Edges are drawn below nodes. Sources share a rail separate from the verdict log. -->
  <path class="route" d="M134 148V169"/>
  <path class="route" d="M134 232V253"/>
  <path class="route" d="M134 316V337"/>
  <path class="route" d="M238 371H276V144H316"/>
  <path class="route" d="M582 144H663"/>
  <path class="approved" d="M846 144H931"/>
  <path class="route" d="M1040 184V231"/>
  <path class="route" d="M1040 299V338"/>
  <path class="correction" d="M712 198V231H537V283"/>
  <path class="correction" d="M397 322H374V200"/>
  <path class="route" d="M792 198V283"/>
  <path class="log" d="M846 176H891V451H1121V528"/>
  <path class="evidence" d="M149 529V461H725V529 M445 461V529"/>
  <path class="evidence" d="M337 461V200" marker-end="url(#pass)"/>
  <g fill="#286b60"><circle cx="337" cy="461" r="3.5"/><circle cx="445" cy="461" r="3.5"/></g>

  <g text-anchor="middle">
    <rect class="box" x="31" y="88" width="207" height="60" rx="5"/>
    <text class="name" x="134" y="126">사용자 요청</text>
    <rect class="box" x="31" y="170" width="207" height="62" rx="5"/>
    <text class="name" x="134" y="199">맥락 정리</text><text class="sub" x="134" y="222">질문 · 조건 · 자료</text>
    <rect x="31" y="254" width="207" height="62" rx="5" fill="#e6edf9" stroke="#5572ad" stroke-width="1.5"/>
    <text class="name" x="134" y="283">AI 모델</text><text class="sub" x="134" y="306">초안 생성</text>
    <rect class="box" x="31" y="338" width="207" height="66" rx="5"/>
    <text class="name" x="134" y="367">항목 나누기</text><text class="sub" x="134" y="391">수치 · 인용 · 주장</text>

    <rect x="317" y="91" width="265" height="108" rx="6" fill="#284881"/>
    <text x="449" y="129" class="name" style="fill:white">원문과 대조</text>
    <text x="449" y="159" class="sub" style="fill:#f2f6ff">근거가 실제로 있는가?</text>
    <text x="449" y="183" class="sub" style="fill:#f2f6ff">수치와 문맥이 맞는가?</text>
    <rect x="664" y="91" width="182" height="107" rx="5" fill="#fff" stroke="#536b82" stroke-width="1.6"/>
    <text x="755" y="139" class="name">항목 판정</text><text x="755" y="171" class="sub">검사 코드 · 사람</text>
    <rect x="397" y="284" width="225" height="82" rx="5" fill="#fff7ed" stroke="#ac793f" stroke-width="1.5"/>
    <text class="name" x="510" y="318" style="fill:#78460e">수정</text><text class="sub" x="510" y="346">원문대로 해당 항목 정정</text>
    <rect class="box" x="659" y="284" width="187" height="82" rx="5"/>
    <text class="name" x="752" y="318">제외</text><text class="sub" x="752" y="346">근거 없음 · 재검사 실패</text>

    <text x="885" y="131" font-size="17" font-weight="700" style="fill:#176550">통과</text>
    <rect x="932" y="99" width="216" height="85" rx="5" fill="#e6f1eb" stroke="#478270" stroke-width="1.5"/>
    <text class="name" x="1040" y="135" style="fill:#164f40">근거 첨부</text><text class="sub" x="1040" y="165">원문 위치 · 인용</text>
    <rect class="box" x="932" y="232" width="216" height="67" rx="5"/>
    <text class="name" x="1040" y="274">응답 제시</text>
    <rect class="box" x="932" y="339" width="216" height="65" rx="5"/>
    <text class="name" x="1040" y="369">사용자 확인</text><text class="sub" x="1040" y="393">답과 근거 함께 읽기</text>
  </g>
  <text x="386" y="262" font-size="18" font-weight="700" style="fill:#875219">한 번 재검사</text>

  <g text-anchor="middle">
    <rect class="box" x="32" y="529" width="234" height="60" rx="4"/>
    <text class="name" x="149" y="556">기준 자료</text><text class="sub" x="149" y="580">선정 기준 · 작성 지침</text>
    <rect class="box" x="308" y="529" width="274" height="60" rx="4"/>
    <text class="name" x="445" y="556">운영 기록</text><text class="sub" x="445" y="580">날짜 · 상태 · 측정값</text>
    <rect class="box" x="619" y="529" width="212" height="60" rx="4"/>
    <text class="name" x="725" y="556">외부 원문</text><text class="sub" x="725" y="580">논문 · 공식 문서</text>
    <rect x="932" y="529" width="216" height="60" rx="4" fill="#fff" stroke="#927fa5" stroke-width="1.4"/>
    <text class="name" x="1040" y="556">검증 기록</text><text class="sub" x="1040" y="580">판정 · 출처 · 수정 내역</text>
  </g>
</svg>
